# Novellire configuration example.
# Copy this file to `config.toml` in the repository root and adjust as needed.
# Relative `data_dir` values resolve against the repository root.
#
# Environment overrides:
#   NOVELLIRE_CONFIG      path to an alternative configuration file
#   NOVELLIRE_DATA_DIR    overrides `data_dir`
#   NOVELLIRE_OLLAMA_URL  overrides `ollama.base_url`
#   NOVELLIRE_CLOUD_ENABLED / NOVELLIRE_CLOUD_URL / NOVELLIRE_CLOUD_MODEL
#                         override the matching `[cloud]` values
#   NOVELLIRE_CLOUD_API_KEY
#                         holds the cloud API key; never put it in this file

data_dir = "data"
log_level = "INFO"

[ollama]
# Ollama must be running locally. Start it with `ollama serve`.
base_url = "http://localhost:11434"
# Wall-clock limit for a single generation request, in seconds.
request_timeout_seconds = 180.0
# Limit for establishing the connection, in seconds.
connect_timeout_seconds = 5.0
# How long Ollama keeps the model in memory after a request.
keep_alive = "5m"

[cloud]
# Opt-in hosted inference over an OpenAI-compatible API. Off by default: while
# disabled, every request goes to local Ollama and no project content leaves
# this machine. Enabling it sends each prompt and its retrieved context to
# `base_url` under that provider's terms.
enabled = false
base_url = "https://api.openai.com/v1"
# Name of the environment variable holding the key. Keep the key out of this
# file; the value is read from the environment at startup.
api_key_env = "NOVELLIRE_CLOUD_API_KEY"
# Model name to use when the selected generation model is empty, e.g.
# "gpt-4o-mini" or an OpenRouter model id. Choose the active model in Settings.
model = ""
request_timeout_seconds = 120.0
connect_timeout_seconds = 10.0

[analysis]
# Analyse saved chapters in the background, one inference request at a time.
auto_run = true

[generation]
# Empty model means "choose the first model Ollama reports".
model = "qwen2.5:1.5b"
temperature = 0.8
top_p = 0.9
# Maximum tokens to generate. Keep low on 8 GB machines.
num_predict = 700
# Model context window. Larger values cost RAM.
context_window = 4096
