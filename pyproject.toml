[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "novellire"
version = "0.4.0"
description = "AI narrative intelligence & novel writing environment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "requests>=2.31,<3",
    "pydantic>=2.6,<3",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/theprabir/Novellire"
Issues = "https://github.com/theprabir/Novellire/issues"

[project.scripts]
novellire = "novellire.__main__:main"

[tool.setuptools.packages.find]
include = ["novellire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
