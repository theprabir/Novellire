[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novellire"
version = "0.2.0"
description = "Local-first AI narrative intelligence and novel writing environment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "requests>=2.31,<3",
    "pydantic>=2.6,<3",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[project.scripts]
novellire = "novellire.__main__:main"

[tool.setuptools.packages.find]
include = ["novellire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
