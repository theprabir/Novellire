<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novellire</title>
  <meta name="description" content="AI narrative intelligence and novel writing environment">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a78bfa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20.2 12.2a6 6 0 0 0-8.5-8.5L5 10.5V19h8.5z'/%3E%3Cpath d='M16 8 2 22'/%3E%3Cpath d='M17.5 15H9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css?v=0.6.0">
  <script>
    // Apply the cached appearance before first paint so the theme never flashes.
    try {
      const cached = JSON.parse(localStorage.getItem('novellire.appearance') || 'null');
      if (cached) {
        const root = document.documentElement;
        root.dataset.accent = cached.accent || 'violet';
        root.dataset.readingWidth = cached.reading_width || 'standard';
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        root.dataset.theme = cached.theme === 'system'
          ? (prefersLight ? 'light' : 'dark')
          : (cached.theme || 'dark');
        root.style.setProperty('--ui-font-size', (cached.ui_font_size || 14) + 'px');
        root.style.setProperty('--reading-font-size', (cached.reading_font_size || 19) + 'px');
        const uiFonts = {
          system: '"Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif',
          humanist: '"Segoe UI", "Trebuchet MS", Verdana, sans-serif',
          serif: 'Georgia, "Iowan Old Style", "Times New Roman", serif',
          mono: '"Cascadia Code", "JetBrains Mono", Consolas, monospace'
        };
        const readingFonts = {
          garamond: '"EB Garamond", "Adobe Garamond Pro", Garamond, "Times New Roman", Georgia, serif',
          georgia: 'Georgia, "Iowan Old Style", "Times New Roman", serif',
          palatino: '"Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif'
        };
        if (cached.ui_font) root.style.setProperty('--ui-font', uiFonts[cached.ui_font] || uiFonts.system);
        if (cached.reading_font) root.style.setProperty('--reading-font', readingFonts[cached.reading_font] || readingFonts.garamond);
      }
    } catch (error) { /* appearance is optional */ }
  </script>
</head>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-feather"></use></svg></span>
      <span class="brand-text">
        <strong>Novellire</strong>
        <small>narrative studio</small>
      </span>
    </div>

    <div class="sidebar-scroll">
      <section class="side-section" aria-labelledby="projects-label">
        <div class="side-heading">
          <span id="projects-label">Projects</span>

          </button>
        </div>
        <div class="project-list" id="project-list"></div>
      </section>

      <nav class="side-nav" id="side-nav" aria-label="Sections"></nav>

      <section class="side-section" id="files-section" aria-labelledby="files-label">
        <div class="side-heading"><span id="files-label">Project files</span></div>
        <div class="file-tree" id="file-tree"></div>
      </section>
    </div>

    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <main class="main">

      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <div class="view" id="view" tabindex="-1"></div>
  </main>
</div>

    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</dialog>
